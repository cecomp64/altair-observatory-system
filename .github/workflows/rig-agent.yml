name: rig-agent

# The rig agent (robs) CI. Runs from rig-agent/ on changes to it or to the API contract.
on:
  pull_request:
    paths: [ "rig-agent/**", "contracts/**", ".github/workflows/rig-agent.yml" ]
  push:
    branches: [ main ]
    paths: [ "rig-agent/**", "contracts/**", ".github/workflows/rig-agent.yml" ]
  workflow_call:    # the release workflow runs the same checks first
  workflow_dispatch:

defaults:
  run:
    working-directory: rig-agent
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Python, and the one robs.exe is built with on Windows
        # (the rig PCs run Windows).
        include:
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (locked)
        run: uv sync --locked --extra dev

      - name: Component independence (no imports of altair or hub)
        run: uv run --locked lint-imports

      - name: Tests
        run: uv run --locked pytest
