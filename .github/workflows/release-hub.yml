name: release-hub

# Tag hub-vX.Y.Z to release the Hub: its CI runs first, then the Docker image is
# built from hub/ and pushed to GitHub Container Registry as
# ghcr.io/<owner>/altair-hub:X.Y.Z (and :latest for a final release). Deploying
# stays a deliberate step: `kamal deploy` from hub/, which needs the server's
# secrets. A tag with a suffix (-rc1) is a pre-release.
on:
  push:
    tags: [ "hub-v*" ]

permissions:
  contents: write
  packages: write

jobs:
  checks:
    uses: ./.github/workflows/hub.yml

  image:
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#hub-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/altair-hub" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "tags=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/altair-hub:$version" >> "$GITHUB_OUTPUT"
          else echo "tags=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/altair-hub:$version,ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/altair-hub:latest" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: hub
          push: true
          tags: ${{ steps.version.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

  release:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          name: Hub ${{ needs.image.outputs.version }}
          prerelease: ${{ contains(needs.image.outputs.version, '-') }}
          body: |
            The Hub ${{ needs.image.outputs.version }}: image `ghcr.io/${{ github.repository_owner }}/altair-hub:${{ needs.image.outputs.version }}`.
            Deploy with `kamal deploy` from hub/. Migrations run on boot (bin/docker-entrypoint).
