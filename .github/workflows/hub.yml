name: hub

# The Hub (Rails) CI. Runs from hub/ on changes to hub/ or to the API contract.
on:
  pull_request:
    paths: [ "hub/**", "contracts/schemas/**", ".github/workflows/hub.yml" ]
  push:
    branches: [ main ]
    paths: [ "hub/**", "contracts/schemas/**", ".github/workflows/hub.yml" ]

defaults:
  run:
    working-directory: hub

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: hub
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

      - name: The Hub never loads files from other components at runtime
        run: |
          if grep -rnE '\.\./(contracts|rig-agent|processing)' app config lib bin; then
            echo "::error::hub/ must not reference other components outside spec/ (docs/SYSTEM_ARCHITECTURE.md §3.6.2)"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: hub
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('hub/.ruby-version', 'hub/**/.rubocop.yml', 'hub/**/.rubocop_todo.yml', 'hub/Gemfile.lock') }}
        with:
          path: hub/${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/remote_observatory_queueing_system_test
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: hub
          bundler-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: hub/.node-version
          cache: yarn
          cache-dependency-path: hub/yarn.lock

      - uses: oven-sh/setup-bun@v2

      - name: Build assets
        run: |
          yarn install --frozen-lockfile
          yarn build
          bun run build:css

      - name: Prepare database
        run: bin/rails db:create db:schema:load

      - name: RSpec (includes the contract specs against ../contracts/schemas)
        run: bundle exec rspec
