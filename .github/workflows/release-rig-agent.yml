name: release-rig-agent

# Builds robs.exe for the rig PCs.
#
# - Pushing a tag rig-agent-vX.Y.Z (matching rig-agent/pyproject.toml) builds the
#   executable and attaches it to the GitHub Release for that tag, creating the release
#   if there isn't one yet. A tag with a suffix (-rc1) makes a pre-release.
# - Running the workflow by hand (Actions -> release-rig-agent -> Run workflow) builds
#   from the chosen branch and keeps the result as a workflow artifact, with no release.
#
# The rig agent's CI runs first. See docs/RELEASING.md.
on:
  push:
    tags: [ "rig-agent-v*" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-rig-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/rig-agent.yml

  build:
    needs: checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rig-agent
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: The tag matches the package version
        id: version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version=$(sed -nE 's/^version = "(.*)"/\1/p' pyproject.toml | head -1)
          if [ -n "$TAG" ] && [ "${TAG#rig-agent-v}" != "$version" ]; then
            echo "::error::tag $TAG does not match rig-agent/pyproject.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build robs.exe
        run: |
          uv sync --locked
          uv run --no-sync --with pyinstaller pyinstaller --noconfirm packaging/robs.spec
          ./dist/robs.exe --help
          mkdir -p ../release
          cp dist/robs.exe "../release/robs-${{ steps.version.outputs.version }}-windows-x64.exe"
          cp config/example.telescope.yml ../release/
          cd ../release && sha256sum * > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: rig-agent-${{ steps.version.outputs.version }}
          path: release/

  attach:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rig-agent-${{ needs.build.outputs.version }}
          path: release

      # The release may already exist, made on the website before or with the tag.
      - name: Create the release if there isn't one
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            prerelease=""; case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" --verify-tag --title "rig agent $VERSION" --notes "" $prerelease
          fi

      - name: Attach the executable to the release
        run: gh release upload "$TAG" release/* --clobber

      - name: Add install notes if the release has none
        run: |
          if [ -z "$(gh release view "$TAG" --json body -q .body)" ]; then
            gh release edit "$TAG" --notes "\`robs\` $VERSION for the rig PCs (Windows, single file).
          Download \`robs-$VERSION-windows-x64.exe\` and \`example.telescope.yml\`, check the hash
          against \`SHA256SUMS\`, and follow rig-agent/docs/INSTALL.md."
          fi
