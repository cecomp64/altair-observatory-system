[project]
name = "observatory-contracts"
version = "1.0.0"
description = "Pydantic models for the Hub API contract (generated from contracts/schemas)."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "jsonschema[format]>=4.18",
]
codegen = [
  "datamodel-code-generator==0.83.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
