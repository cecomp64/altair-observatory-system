# Copy this file per telescope (e.g. config/backyard-16in.yml) and fill
# it in. `api_key` can be omitted here and supplied instead via the
# ROBS_<SLUG>_API_KEY environment variable so it never touches disk.

slug: backyard-16in

# The Hub and a telescope API key (Hub: Admin -> Telescopes -> API keys).
api_base_url: "https://observatory.example.org"
api_key: "REPLACE_ME"

# Local path to NINA's Target Scheduler plugin SQLite database.
scheduler_db_path: "C:/Users/Observatory/AppData/Local/NINA/SchedulerPlugin/schedulerdb.sqlite"

# The NINA equipment profile GUID Target Scheduler should file this
# telescope's projects/exposure templates under (NINA -> Options ->
# General -> Profile, or the plugin's own settings screen).
nina_profile_id: "00000000-0000-0000-0000-000000000000"

# Where NINA writes this telescope's light/dark/flat/bias frames.
subs_dir: "D:/Observatory/Subs/backyard-16in"

# IANA timezone of the site; must match the Hub telescope (robs check-config).
timezone: "America/Los_Angeles"

# per_hub_project (default): one Target Scheduler project per Hub project.
# single: every target in one "Remote Observatory Queue" project.
ts_project_mode: per_hub_project

# Standalone, without a Hub: schedule from a file, log locally, and signal
# Altair with its session-end marker.
# hub:
#   enabled: false
# targets_file: "C:/Observatory/targets.json"
# altair_marker_dir: "D:/Observatory/Subs/backyard-16in/_altair"
