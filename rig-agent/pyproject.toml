[project]
name = "remote-observatory-worker"
version = "0.3.0"
description = "Rig agent: syncs Hub targets into NINA Target Scheduler and reports progress and session events."
requires-python = ">=3.10"
dependencies = [
  "observatory-contracts",
  "requests>=2.31",
  "PyYAML>=6.0",
  "click>=8.1",
  "tzdata; sys_platform == 'win32'",  # zoneinfo has no system database on Windows
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-mock>=3.12",
  "responses>=0.25",
  "import-linter>=2.0",
  "jsonschema[format]>=4.18",
]

[tool.uv.sources]
observatory-contracts = { path = "../contracts/python", editable = true }

[project.scripts]
robs = "robs.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Component independence (docs/SYSTEM_ARCHITECTURE.md §3.6.2): the rig agent talks to
# the Hub over HTTP only and never imports the processing core. Run: lint-imports
[tool.importlinter]
root_package = "robs"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The rig agent never imports the processing core or the Hub"
type = "forbidden"
source_modules = ["robs"]
forbidden_modules = ["altair", "hub"]
