[project]
name = "remote-observatory-worker"
version = "0.1.0"
description = "Observatory-side worker: syncs targets into NINA Target Scheduler, reports progress, and publishes subs/stacks to S3."
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "boto3>=1.34",
  "PyYAML>=6.0",
  "click>=8.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-mock>=3.12",
  "responses>=0.25",
]

[project.scripts]
robs = "robs.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
